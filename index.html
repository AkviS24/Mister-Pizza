<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="./logic/meals-db.js" defer></script>
    <script type="text/javascript" src="./logic/templates.js" defer></script>
    <script type="text/javascript" src="./logic/main.js" defer></script>
    <link rel="stylesheet" href="./styles/basic.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/templates.css">
    <link rel="icon" type="image/icon" href="./img/burger-icon.png">
    <title>Mr. Pizza</title>
</head>

<body>
    <header class="header orange">
        <div class="header-content container">
            <img class="h60wauto" src="./img/Logo02.png">
            <img class="h40wauto menuBtn" src="./img/dehaze.png" tabindex="0">
        </div>
    </header>
    <img src="./img/hero.jpg" class="hero" alt="background image with pizza">
    <div class="container center">
        <img src="./img/icon.png" class="hero-burger" alt="a burger comic image">
    </div>
    <div class="container center">
        <img src="./img/Frame 58.png" class="slogan" alt="Burger House - the best burger in town">
    </div>

    <div class="container">
        <dialog id="menu">
            <header class="dialogHeader">
                <h2>Your order is on the way</h2>
            </header>
            <section class="dialogMain"><img id="truck" class="truck" src="./img/truck.png"></section>
            <footer class="dialogFooter">
                <button class="okBtn" onclick="closeMenu()">Ok</button>
            </footer>
        </dialog>
    </div>

    <main class="container main">
        <div class="basket">
            <h2>Your basket</h2>
            <div id="basket-content"></div>
            <div class="basket-sum" id="basket-sum"></div>
        </div>

        <button class="basketButton" onclick="showBasket()" aria-haspopup="dialog" aria-controls="basket-open">Show
            Basket</button>


        <dialog class="basket-open" id="basket-open">
            <div class="basket">
                <h2>Your basket</h2>
                <div id="basket-content"></div>
                <div class="basket-sum" id="basket-sum"></div>
            </div>
        </dialog>


        <div class="food-wrapper">
            <div class="seperator orange">
                <img class="seperator-icon" src="./img/burger-icon.png" alt="burger&sandwiches">
                <h2 class="seperator-text">Burger & Sandwiches</h2>
            </div>

            <section class="food-content" id="burger-content"></section>

            <div class="seperator orange">
                <img class="seperator-icon" src="./img/pizza-icon.png" alt="pizza">
                <h2 class="seperator-text">Pizza (30cm)</h2>
            </div>

            <section class="food-content" id="pizza-content"></section>

            <div class="seperator orange">
                <img class="seperator-icon" src="./img/salad-icon.png" alt="salad">
                <h2 class="seperator-text">Salads</h2>
            </div>

            <section class="food-content" id="salad-content"></section>
        </div>
    </main>
    <footer class="footer orange">
        <div class="container space-around">
            <span><img src="./img/copyright.png">2026 BurgerHouse</span>
            <a href="#">Imprint</a>
            <a href="#">Cookie Preferences </a>
        </div>
    </footer>
</body>

</html>
